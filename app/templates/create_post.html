{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block content %}
<table width="100%" border="0" cellpadding="10" cellspacing="0">
    <tr>
        <td style="text-align: center;">
            <h2 style="color: #FF0000;">Создание поста</h2>
            <form method="POST" action="{{ url_for('create_post') }}">
                {{ form.hidden_tag() }}
                <table border="1" cellpadding="5" cellspacing="0" style="background-color: #FFFFCC; margin: 0 auto;">
                    <tr>
                        <td>{{ form.title.label }}</td>
                        <td><input type="text" name="title" value="{{ form.title.data or '' }}" size="50"></td>
                    </tr>
                    <tr>
                        <td>{{ form.preview.label }}</td>
                        <td><textarea name="preview" rows="3" cols="50">{{ form.preview.data or '' }}</textarea></td>
                    </tr>
                    <tr>
                        <td>{{ form.body.label }}</td>
                        <td><textarea id="post_body" name="body" rows="10" cols="50">{{ form.body.data if form.body.data else ''|safe }}</textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <input type="submit" value="Create Post" style="background-color: #00FF00; color: #000000; padding: 5px 10px; font-size: 16px;">
                        </td>
                    </tr>
                </table>
            </form>
            <p style="margin-top: 20px;"><a href="{{ url_for('index') }}" style="color: #0000FF;">Назад</a></p>
        </td>
    </tr>
</table>
{% endblock %}
