{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<table width="100%" border="0" cellpadding="10" cellspacing="0">
    <tr>
        <td style="text-align: center;">
            <h2 style="color: #FF0000;">Login</h2>
            <form method="POST">
                {{ form.hidden_tag() }}
                <table border="1" cellpadding="5" cellspacing="0" style="background-color: #FFFFCC; margin: 0 auto;">
                    <tr>
                        <td>{{ form.username.label }}</td>
                        <td><input type="text" name="username" value="{{ form.username.data or '' }}"></td>
                    </tr>
                    <tr>
                        <td>{{ form.password.label }}</td>
                        <td><input type="password" name="password"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            {{ form.remember_me() }} {{ form.remember_me.label }}
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <input type="submit" value="Login" style="background-color: #00FF00; color: #000000; padding: 5px 10px; font-size: 16px;">
                        </td>
                    </tr>
                </table>
            </form>
            <p style="margin-top: 20px;">Новый пользователь? <a href="{{ url_for('register') }}" style="color: #0000FF;">Sign-up</a></p>
        </td>
    </tr>
</table>
{% endblock %}
