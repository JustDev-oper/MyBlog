services:
  app:
    build: .
    container_name: app
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: blog.py
      FLASK_ENV: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db
  db:
    image: postgres:18.3-bookworm
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: database-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp:db:5432
    ports:
      - "127.0.0.1:5432:5432"
